# GPU environment for deepnet server
# Use this on your Linux server with NVIDIA GPU
#
# Usage:
#   conda env create -f environment-gpu.yml
#   conda activate thermal-homography-gpu

name: thermal-homography-gpu
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # PyTorch with CUDA 12.1
  - pytorch=2.2
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # PyTorch Geometric with CUDA
  - pyg=2.5
  - pytorch-scatter
  - pytorch-sparse
  - pytorch-cluster

  # CUDA tools
  - cudatoolkit=12.1

  # Scientific computing
  - numpy>=1.24
  - scipy>=1.11
  - scikit-learn>=1.3
  - pandas>=2.0

  # Image processing
  - opencv>=4.8
  - pillow>=10.0
  - scikit-image>=0.21

  # Visualization
  - matplotlib>=3.8
  - seaborn>=0.13

  # Development tools
  - pytest>=7.4
  - pytest-cov

  # pip packages
  - pip
  - pip:
    - escnn>=1.0.12
    - kornia>=0.7.0
    - albumentations>=1.3.1
    - hydra-core>=1.3.2
    - omegaconf>=2.3.0
    - wandb>=0.16.0
    - pytorch-lightning>=2.1.0
    - einops>=0.7.0
    - tqdm>=4.66.0
    - pyyaml>=6.0
    - rich>=13.7.0
    - requests>=2.31.0
