name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools

          # Install core dependencies (skip escnn - has broken build)
          pip install numpy scipy
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install torch-geometric
          pip install pytorch-lightning hydra-core wandb
          pip install kornia albumentations einops opencv-python tqdm rich

          # Install dev dependencies
          pip install pytest pytest-cov black ruff

      - name: Run basic tests (skip E2 layers that need escnn)
        run: |
          pytest tests/test_data.py tests/test_training.py -v --tb=short -x

      - name: Verify core imports
        run: |
          python -c "import torch; print(f'PyTorch {torch.__version__}')"
          python -c "import torch_geometric; print('PyG OK')"
          python -c "import kornia; print('Kornia OK')"
          python -c "from src.data import SyntheticThermalGenerator; print('Data OK')"
          python -c "from src.training.losses import HomographyLoss; print('Losses OK')"
          python -c "from src.training.metrics import corner_error; print('Metrics OK')"
